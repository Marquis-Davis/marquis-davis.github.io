name: Apply Shared Site Components

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'weather-banner.js'
      - 'weather-banner.css'
      - 'system-health.js'
      - 'system-health.css'
      - 'provenance.js'
      - 'provenance.css'
      - 'provenance.json'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - '.github/workflows/apply-weather-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-shared-components:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add shared components and provenance to site pages
        shell: python
        run: |
          from pathlib import Path

          weather_style = '<link rel="stylesheet" href="weather-banner.css?v=20260916">'
          health_style = '<link rel="stylesheet" href="system-health.css?v=20260916">'
          provenance_style = '<link rel="stylesheet" href="provenance.css?v=20260916">'
          weather_script = '<script src="weather-banner.js?v=20260916" defer></script>'
          health_script = '<script src="system-health.js?v=20260916" defer></script>'
          provenance_script = '<script src="provenance.js?v=20260916" defer></script>'
          provenance_head = '''    <!-- Portfolio provenance: MD-AIPE-2008-7F3C91 · Marquis Davis · All Rights Reserved -->
              <meta name="author" content="Marquis Davis">
              <meta name="copyright" content="Copyright © 2026 Marquis Davis. All rights reserved.">
              <meta name="portfolio-build-id" content="MD-AIPE-2008-7F3C91">'''
          changed = []

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              if 'portfolio-build-id' not in text and '</head>' in text:
                  text = text.replace('</head>', f'{provenance_head}\n</head>', 1)

              if 'weather-banner.css' not in text and '</head>' in text:
                  text = text.replace('</head>', f'    {weather_style}\n</head>', 1)

              if 'system-health.css' not in text and '</head>' in text:
                  text = text.replace('</head>', f'    {health_style}\n</head>', 1)

              if 'provenance.css' not in text and '</head>' in text:
                  text = text.replace('</head>', f'    {provenance_style}\n</head>', 1)

              # index.html already contains its Orlando weather strip directly.
              if path.name != 'index.html' and 'weather-banner.js' not in text and '</body>' in text:
                  text = text.replace('</body>', f'{weather_script}\n</body>', 1)

              if 'system-health.js' not in text and '</body>' in text:
                  text = text.replace('</body>', f'{health_script}\n</body>', 1)

              if 'provenance.js' not in text and '</body>' in text:
                  text = text.replace('</body>', f'{provenance_script}\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          if changed:
              print('Updated: ' + ', '.join(changed))
          else:
              print('All HTML pages already include shared components and provenance markers.')

      - name: Commit shared component references
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No page updates required."
            exit 0
          fi

          git config user.name "Marquis Davis"
          git config user.email "102924796+Marquis-Davis@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Apply shared site components and provenance"
          git push

name: Refresh Live Portfolio Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull current Microsoft Defender versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.microsoft.com/en-us/wdsi/defenderupdates'
          $maxAttempts = 4
          $response = $null

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Write-Host "Defender data request attempt $attempt of $maxAttempts"
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30 -Headers @{ 'User-Agent' = 'Mozilla/5.0' }

              if ($response.Content -match 'experiencing high demand|please wait and try again later') {
                throw 'Microsoft returned a temporary high-demand page.'
              }

              if (-not $response.Content) {
                throw 'Microsoft Defender update page returned no content.'
              }

              break
            }
            catch {
              Write-Warning "Attempt $attempt failed: $($_.Exception.Message)"

              if ($attempt -lt $maxAttempts) {
                $delay = [math]::Pow(2, $attempt) * 15
                Write-Host "Waiting $delay seconds before retry..."
                Start-Sleep -Seconds $delay
              }
            }
          }

          if (-not $response -or -not $response.Content -or $response.Content -match 'experiencing high demand|please wait and try again later') {
            if (Test-Path 'data/defender-current.json') {
              Write-Warning 'Microsoft is temporarily unavailable. Keeping the last known good Defender data instead of failing the workflow.'
              exit 0
            }

            throw 'Microsoft Defender data could not be retrieved and no cached data is available.'
          }

          $text = $response.Content
          $text = [regex]::Replace($text, '(?is)<script.*?</script>', ' ')
          $text = [regex]::Replace($text, '(?is)<style.*?</style>', ' ')
          $text = [regex]::Replace($text, '(?s)<[^>]+>', ' ')
          $text = [System.Net.WebUtility]::HtmlDecode($text)
          $text = [regex]::Replace($text, '\s+', ' ')

          $pattern = 'Latest security intelligence update.*?Version:\s*(?<Intel>\d+\.\d+\.\d+\.\d+)\s+Engine Version:\s*(?<Engine>\d+\.\d+\.\d+\.\d+)\s+Platform Version:\s*(?<Platform>\d+\.\d+\.\d+\.\d+)\s+Released:\s*(?<Released>.+?)\s+Documentation:'
          $match = [regex]::Match($text, $pattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)

          if (-not $match.Success) {
            if (Test-Path 'data/defender-current.json') {
              Write-Warning 'Microsoft page format changed or could not be parsed. Keeping the last known good Defender data.'
              exit 0
            }

            throw 'Unable to parse Defender version information from Microsoft and no cached data is available.'
          }

          $data = [ordered]@{
            securityIntelligenceVersion = $match.Groups['Intel'].Value
            engineVersion               = $match.Groups['Engine'].Value
            platformVersion             = $match.Groups['Platform'].Value
            released                    = $match.Groups['Released'].Value.Trim()
            retrievedAtUtc              = (Get-Date).ToUniversalTime().ToString('o')
            source                      = $url
          }

          New-Item -ItemType Directory -Path data -Force | Out-Null
          $data | ConvertTo-Json -Depth 4 | Set-Content -Path 'data/defender-current.json' -Encoding UTF8

      - name: Generate engineering activity feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'marquis-portfolio-activity'
          }

          $repoApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $defender = Get-Content 'data/defender-current.json' -Raw | ConvertFrom-Json

          $commits = Invoke-RestMethod -Uri "$repoApi/commits?per_page=20" -Headers $headers
          $latestHumanCommit = $commits | Where-Object {
            $_.author.login -ne 'github-actions[bot]' -and
            $_.commit.message -notmatch '^Refresh live portfolio data' -and
            $_.commit.message -notmatch '^Refresh Microsoft Defender current versions'
          } | Select-Object -First 1

          $runs = Invoke-RestMethod -Uri "$repoApi/actions/runs?status=success&per_page=30" -Headers $headers
          $pagesRun = $runs.workflow_runs | Where-Object { $_.name -eq 'pages build and deployment' } | Sort-Object created_at -Descending | Select-Object -First 1

          $driverCommits = Invoke-RestMethod -Uri 'https://api.github.com/repos/Marquis-Davis/modern-endpoint-platform/commits?path=ConfigMgr/Driver%20%26%20BIOS%20Automation&per_page=1' -Headers $headers
          $driverCommit = $driverCommits | Select-Object -First 1

          $items = @()

          $items += [ordered]@{
            id = 'defender'
            label = 'Defender data refreshed'
            detail = "Platform $($defender.platformVersion) • Intelligence $($defender.securityIntelligenceVersion)"
            timestamp = $defender.retrievedAtUtc
            status = 'healthy'
            url = 'zero-day-defender-osd-lab.html'
          }

          if ($pagesRun) {
            $items += [ordered]@{
              id = 'deployment'
              label = 'Portfolio deployment succeeded'
              detail = 'GitHub Pages • main'
              timestamp = $pagesRun.updated_at
              status = 'healthy'
              url = $pagesRun.html_url
            }
          }

          if ($driverCommit) {
            $items += [ordered]@{
              id = 'driver-bios'
              label = 'Driver / BIOS automation updated'
              detail = (($driverCommit.commit.message -split "`n")[0])
              timestamp = $driverCommit.commit.author.date
              status = 'info'
              url = $driverCommit.html_url
            }
          }

          $items += [ordered]@{
            id = 'ai-agent'
            label = 'AI Endpoint Agent'
            detail = 'Active build • Foundry + Graph + Intune architecture'
            timestamp = $null
            status = 'building'
            statusText = 'In progress'
            url = '#lab'
          }

          if ($latestHumanCommit) {
            $items += [ordered]@{
              id = 'commit'
              label = 'Latest GitHub commit'
              detail = (($latestHumanCommit.commit.message -split "`n")[0])
              timestamp = $latestHumanCommit.commit.author.date
              status = 'info'
              url = $latestHumanCommit.html_url
            }
          }

          $activity = [ordered]@{
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            items = $items
          }

          $activity | ConvertTo-Json -Depth 6 | Set-Content -Path 'data/activity.json' -Encoding UTF8

      - name: Commit updated live data
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/defender-current.json data/activity.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Refresh live portfolio data [skip ci]"
            git push
          }

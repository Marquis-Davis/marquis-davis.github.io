name: Refresh AI Radar Market Prices

on:
  workflow_dispatch:
  schedule:
    # Mid-session and after the U.S. market close on weekdays.
    - cron: '30 17,21 * * 1-5'

permissions:
  contents: write

jobs:
  refresh-market-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh market snapshot
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request
          from datetime import datetime, timezone

          path = pathlib.Path('data/ai-market-context.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          changed = False

          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; MarquisDavisPortfolio/1.0)'
          }

          for company in data.get('companies', []):
              symbol = company['ticker']
              url = f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range=1d&interval=5m&includePrePost=false'
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)

                  result = payload['chart']['result'][0]
                  meta = result['meta']
                  price = meta.get('regularMarketPrice')
                  previous = meta.get('chartPreviousClose') or meta.get('previousClose')
                  market_time = meta.get('regularMarketTime')

                  if price is None or previous in (None, 0):
                      print(f'{symbol}: quote did not contain a usable price')
                      continue

                  price = round(float(price), 2)
                  previous = float(previous)
                  change = round(price - previous, 2)
                  change_pct = round((change / previous) * 100, 2)

                  old_tuple = (
                      company.get('price'),
                      company.get('change'),
                      company.get('changePercent')
                  )
                  new_tuple = (price, change, change_pct)

                  if old_tuple != new_tuple:
                      company['price'] = price
                      company['change'] = change
                      company['changePercent'] = change_pct
                      company['priceLabel'] = 'Latest market snapshot'
                      if market_time:
                          company['priceAsOf'] = datetime.fromtimestamp(
                              int(market_time), tz=timezone.utc
                          ).isoformat().replace('+00:00', 'Z')
                      changed = True
                      print(f'{symbol}: {old_tuple} -> {new_tuple}')
                  else:
                      print(f'{symbol}: unchanged at {price}')

              except Exception as exc:
                  # Keep the last known good value instead of blanking the dashboard.
                  print(f'{symbol}: refresh failed: {exc}')

          if changed:
              data['generatedAtUtc'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          else:
              print('No market price changes detected; JSON left untouched.')

      - name: Commit updated snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/ai-market-context.json; then
            echo "No market data change to commit."
            exit 0
          fi

          git config user.name "Marquis Davis"
          git config user.email "102924796+Marquis-Davis@users.noreply.github.com"
          git add data/ai-market-context.json
          git commit -m "Refresh AI radar market prices"
          git push
